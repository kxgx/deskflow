name: "Security Scan"

# Standalone vulnerability scanning workflow using DeepSec Shield.
# Local static (L2) rules only; no LLM credentials are required.
# Run as a separate workflow so code scanning results appear in the
# GitHub security UI independently of the main CI build.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  deepsec-shield:
    name: DeepSec Shield Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # full history is needed for git blame attribution of findings
          fetch-depth: 0

      # DeepSec is checked out and run directly instead of using its
      # composite action, which is less transparent and currently
      # broken (its setup-node cache step fails).
      - name: Checkout DeepSec scanner (pinned)
        uses: actions/checkout@v6
        with:
          repository: Unclecheng-li/DeepSec
          ref: c655b822a2aac09240169f21bbadf4ec182e0ff5
          path: .deepsec

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build DeepSec scanner
        working-directory: .deepsec
        run: |
          npm ci
          npm run build

      - name: Run DeepSec Shield scan
        working-directory: .deepsec
        run: |
          node dist/cli.js scan "$GITHUB_WORKSPACE" \
            --fail-on high \
            --package-verification seed \
            --ai-detection author \
            --github-annotations \
            --sarif "$GITHUB_WORKSPACE/deepsec-results.sarif" \
            --markdown "$GITHUB_WORKSPACE/deepsec-report.md" \
            --storage auto \
            --no-store-findings

      - name: Upload SARIF results to code scanning
        if: always() && hashFiles('deepsec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: deepsec-results.sarif

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-report
          path: deepsec-report.md
          if-no-files-found: ignore
