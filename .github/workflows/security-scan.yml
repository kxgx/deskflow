name: "Security Scan"

# Standalone vulnerability scanning workflow using DeepSec Shield.
# Local static (L2) rules only; no LLM credentials are required.
# Run as a separate workflow so code scanning results appear in the
# GitHub security UI independently of the main CI build.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  deepsec-shield:
    name: DeepSec Shield Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # full history is needed for git blame attribution of findings
          fetch-depth: 0

      # DeepSec is checked out outside of the workspace so that the
      # scan does not report findings in the scanner's own code. It is
      # also run directly instead of using its composite action, which
      # is less transparent and currently broken (its setup-node cache
      # step fails).
      - name: Checkout DeepSec scanner (pinned, outside workspace)
        run: |
          git clone --quiet https://github.com/Unclecheng-li/DeepSec.git "$RUNNER_TEMP/deepsec"
          git -C "$RUNNER_TEMP/deepsec" fetch --quiet origin c655b822a2aac09240169f21bbadf4ec182e0ff5
          git -C "$RUNNER_TEMP/deepsec" checkout --quiet c655b822a2aac09240169f21bbadf4ec182e0ff5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build DeepSec scanner
        working-directory: ${{ runner.temp }}/deepsec
        run: |
          npm ci
          npm run build

      - name: Run DeepSec Shield scan
        working-directory: ${{ runner.temp }}/deepsec
        run: |
          node dist/cli.js scan "$GITHUB_WORKSPACE" \
            --fail-on high \
            --package-verification seed \
            --ai-detection author \
            --github-annotations \
            --sarif "$GITHUB_WORKSPACE/deepsec-results.sarif" \
            --markdown "$GITHUB_WORKSPACE/deepsec-report.md" \
            --storage auto \
            --no-store-findings

      - name: Add scan report to job summary
        if: always()
        run: |
          if [ -f deepsec-report.md ]; then
            cat deepsec-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF results to code scanning
        if: always() && hashFiles('deepsec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: deepsec-results.sarif

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepsec-report
          path: deepsec-report.md
          if-no-files-found: ignore
